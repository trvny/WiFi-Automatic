buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

plugins {
  id "org.sonarqube" version "7.4.0.8496"
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

android {

    compileSdk 37

    defaultConfig {
        // Deliberately different from upstream's "de.j4velin.wifiAutoOff": F-Droid requires a
        // fork to ship under its own application ID, so this build installs alongside the
        // original instead of pretending to be an update of it. The Java package (namespace,
        // below) stays upstream's so the source tree needs no rewrite.
        applicationId "io.github.trvny.wifiautomatic"
        minSdk 28
        targetSdk 28
        versionCode 2100
        versionName "2.0.0"
        if (!project.file("key.properties").exists()) {
            resValue "string", "maps_api_key", "0000"
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    flavorDimensions = ["main"]

    productFlavors {
        fdroid {
            dimension "main"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }

    lint {
        // ExpiredTargetSdkVersion is a Google Play requirement; not applicable to F-Droid builds
        disable "ExtraTranslation", "ExpiredTargetSdkVersion"
    }
    namespace 'de.j4velin.wifiAutoOff'
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.19.0'
}
