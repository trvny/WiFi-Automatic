plugins {
    id 'com.android.application' version '9.4.1'
    id 'org.sonarqube' version '7.5.0.8588'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "trvny.wifiautomatic"
        minSdk 28
        targetSdk 28 // apps targeting 29+ can no longer toggle WiFi via WifiManager
        versionCode 2102
        versionName "2.0.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }

    lint {
        // ExpiredTargetSdkVersion is a Google Play requirement; this fork is distributed outside Play.
        disable "ExtraTranslation", "ExpiredTargetSdkVersion"
    }

    namespace 'de.j4velin.wifiAutoOff'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.19.1'
}
