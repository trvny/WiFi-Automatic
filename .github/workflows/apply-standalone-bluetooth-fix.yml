name: Apply standalone Bluetooth timer fix

on:
  push:
    branches: [ fix/standalone-bluetooth-timer ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/standalone-bluetooth-timer

      - name: Apply focused changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/main/java/de/j4velin/wifiAutoOff/Preferences.java",
              'new HashSet<>(Arrays.asList("notice", "status", "log"));',
              'new HashSet<>(Arrays.asList("notice", "status", "log",\n'
              '                    "bluetooth_auto_off_idle"));'
          )

          replace(
              "src/main/java/de/j4velin/wifiAutoOff/Preferences.java",
              '        final SharedPreferences prefs = PreferenceManager.getDefaultSharedPreferences(this);\n\n'
              '        final CheckBoxPreference screen_off = (CheckBoxPreference) findPreference("off_screen_off");',
              '        final SharedPreferences prefs = PreferenceManager.getDefaultSharedPreferences(this);\n\n'
              '        final CheckBoxPreference bluetoothIdle =\n'
              '                (CheckBoxPreference) findPreference("bluetooth_auto_off_idle");\n'
              '        bluetoothIdle.setOnPreferenceChangeListener(new OnPreferenceChangeListener() {\n'
              '            @Override\n'
              '            public boolean onPreferenceChange(final Preference preference,\n'
              '                                              final Object newValue) {\n'
              '                prefs.edit().putBoolean("bluetooth_auto_off_idle",\n'
              '                        (Boolean) newValue).apply();\n'
              '                BluetoothIdleReceiver.updateEnabledState(Preferences.this, prefs);\n'
              '                return true;\n'
              '            }\n'
              '        });\n\n'
              '        final CheckBoxPreference screen_off = (CheckBoxPreference) findPreference("off_screen_off");'
          )

          replace(
              "src/main/java/de/j4velin/wifiAutoOff/Start.java",
              'import android.content.ComponentName;\n',
              ''
          )
          replace(
              "src/main/java/de/j4velin/wifiAutoOff/Start.java",
              'import android.content.pm.PackageManager;\n',
              ''
          )
          replace(
              "src/main/java/de/j4velin/wifiAutoOff/Start.java",
              '        boolean appEnabled = c.getPackageManager().getComponentEnabledSetting(\n'
              '                new ComponentName(c, Receiver.class)) !=\n'
              '                PackageManager.COMPONENT_ENABLED_STATE_DISABLED;\n'
              '        BluetoothIdleReceiver.updateEnabledState(c, prefs, appEnabled);',
              '        BluetoothIdleReceiver.updateEnabledState(c, prefs);'
          )

          replace(
              "src/main/java/de/j4velin/wifiAutoOff/BluetoothIdleReceiver.java",
              '    static void updateEnabledState(final Context context, final SharedPreferences prefs,\n'
              '                                   final boolean enabled) {\n'
              '        if (!enabled) stopTimer(context);',
              '    static void updateEnabledState(final Context context, final SharedPreferences prefs) {\n'
              '        boolean enabled = prefs.getBoolean("bluetooth_auto_off_idle", false);\n'
              '        if (!enabled) stopTimer(context);'
          )

          replace(
              "src/main/res/xml/preferences.xml",
              '    <de.j4velin.wifiAutoOff.StatusPreference\n'
              '        android:key="status"/>\n'
              '    <PreferenceCategory android:title="@string/turn_wifi_on_">',
              '    <de.j4velin.wifiAutoOff.StatusPreference\n'
              '        android:key="status"/>\n'
              '    <PreferenceCategory android:title="@string/bluetooth_auto_off_category">\n'
              '        <CheckBoxPreference\n'
              '            android:defaultValue="false"\n'
              '            android:key="bluetooth_auto_off_idle"\n'
              '            android:summary="@string/bluetooth_auto_off_idle_summary"\n'
              '            android:title="@string/bluetooth_auto_off_idle"/>\n'
              '    </PreferenceCategory>\n'
              '    <PreferenceCategory android:title="@string/turn_wifi_on_">'
          )
          replace(
              "src/main/res/xml/preferences.xml",
              '        <CheckBoxPreference\n'
              '            android:defaultValue="false"\n'
              '            android:key="wifi_bluetooth_connected"\n'
              '            android:title="@string/wifi_off_bluetooth_connected"/>\n'
              '        <CheckBoxPreference\n'
              '            android:defaultValue="false"\n'
              '            android:key="bluetooth_auto_off_idle"\n'
              '            android:summary="@string/bluetooth_auto_off_idle_summary"\n'
              '            android:title="@string/bluetooth_auto_off_idle"/>',
              '        <CheckBoxPreference\n'
              '            android:defaultValue="false"\n'
              '            android:key="wifi_bluetooth_connected"\n'
              '            android:title="@string/wifi_off_bluetooth_connected"/>'
          )

          replace(
              "src/main/res/values/strings.xml",
              '    <string name="enable_disable_bluetooth">Bluetooth automation</string>\n'
              '    <string name="when_wifi_state_changes">Toggle Bluetooth based on WiFi state</string>\n'
              '    <string name="wifi_off_bluetooth_connected">&#8230;unless a Bluetooth device is connected</string>\n'
              '    <string name="bluetooth_auto_off_idle">Turn Bluetooth off after 10 min without a connection</string>\n'
              '    <string name="bluetooth_auto_off_idle_summary">The timer is canceled as soon as a Bluetooth device connects</string>',
              '    <string name="bluetooth_auto_off_category">Bluetooth auto-off</string>\n'
              '    <string name="enable_disable_bluetooth">WiFi and Bluetooth link</string>\n'
              '    <string name="when_wifi_state_changes">Toggle Bluetooth based on WiFi state</string>\n'
              '    <string name="wifi_off_bluetooth_connected">&#8230;unless a Bluetooth device is connected</string>\n'
              '    <string name="bluetooth_auto_off_idle">Turn Bluetooth off after 10 min without a connected device</string>\n'
              '    <string name="bluetooth_auto_off_idle_summary">Works independently of WiFi automation. The timer is canceled when a Bluetooth device connects.</string>'
          )

          replace(
              "src/main/res/values-pl/strings.xml",
              '    <string name="enable_disable_bluetooth">Automatyzacja Bluetooth</string>\n'
              '    <string name="when_wifi_state_changes">Przełączaj Bluetooth razem ze stanem WiFi</string>\n'
              '    <string name="wifi_off_bluetooth_connected">&#8230;chyba że urządzenie Bluetooth jest połączone</string>\n'
              '    <string name="bluetooth_auto_off_idle">Wyłącz Bluetooth po 10 min bez połączenia</string>\n'
              '    <string name="bluetooth_auto_off_idle_summary">Licznik zostanie anulowany, gdy urządzenie Bluetooth się połączy</string>',
              '    <string name="bluetooth_auto_off_category">Automatyczne wyłączanie Bluetooth</string>\n'
              '    <string name="enable_disable_bluetooth">Powiązanie WiFi i Bluetooth</string>\n'
              '    <string name="when_wifi_state_changes">Przełączaj Bluetooth razem ze stanem WiFi</string>\n'
              '    <string name="wifi_off_bluetooth_connected">&#8230;chyba że urządzenie Bluetooth jest połączone</string>\n'
              '    <string name="bluetooth_auto_off_idle">Wyłącz Bluetooth po 10 min bez podłączonego urządzenia</string>\n'
              '    <string name="bluetooth_auto_off_idle_summary">Działa niezależnie od automatyzacji WiFi. Licznik zostanie anulowany po połączeniu urządzenia Bluetooth.</string>'
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main
          git commit -m "fix: make Bluetooth idle timer standalone"
          git push
