name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache assembleFdroidDebug

      - name: Sign and verify debug APK
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find "$GITHUB_WORKSPACE" -path '*/fdroid/debug/*' -name '*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No debug APK found."
            find "$GITHUB_WORKSPACE" -name '*.apk' -print
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          OUT="$GITHUB_WORKSPACE/wifi-automatic-debug.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            "$OUT"
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -F "package: name='trvny.wifiautomatic'"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: installable-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error
