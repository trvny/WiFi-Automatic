name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v1.9.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release names
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Release tag must start with v and contain only filename-safe characters."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleFdroidRelease

      - name: Sign and name APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find "$GITHUB_WORKSPACE" -path '*/release/*' -name '*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK found."
            find "$GITHUB_WORKSPACE" -name '*.apk' -print
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/wifi-automatic-$RELEASE_VERSION.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:env:KEY_PASSWORD" \
            "$OUT"
          "$BT/apksigner" verify "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: step-security/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: WiFi Automatic ${{ steps.release.outputs.version }}
          files: ${{ env.APK }}
          generate_release_notes: true
