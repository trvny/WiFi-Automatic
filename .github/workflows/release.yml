name: Rolling release

on: # yamllint disable-line rule:truthy
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: wifi-automatic-rolling-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve app version
        id: release
        run: |
          version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' build.gradle | head -1)"
          if [ -z "$version" ]; then
            echo "::error::build.gradle has no versionName."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"

          if ! keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/release.jks" \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$check_store" \
            -deststoretype PKCS12 \
            -deststorepass "$check_password" \
            -destkeypass "$check_password" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::Release keystore, alias, or password secrets do not match."
            exit 1
          fi
          rm -f "$check_store"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache assembleFdroidRelease

      - name: Sign and name APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find "$GITHUB_WORKSPACE" -path '*/release/*' -name '*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK found."
            find "$GITHUB_WORKSPACE" -name '*.apk' -print
            exit 1
          fi
          mkdir -p dist
          OUT="$GITHUB_WORKSPACE/dist/wifi-automatic.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            "$OUT"
          "$BT/apksigner" verify --verbose "$OUT"
          EXPECTED_APP_ID="$(sed -n 's/.*applicationId "\([^"]*\)".*/\1/p' build.gradle | head -1)"
          if [ -z "$EXPECTED_APP_ID" ]; then
            echo "::error::Application ID is missing from build.gradle."
            exit 1
          fi
          BADGING="$("$BT/aapt2" dump badging "$OUT")"
          if ! grep -Fq "package: name='$EXPECTED_APP_ID'" <<< "$BADGING"; then
            echo "::error::APK application ID does not match build.gradle ($EXPECTED_APP_ID)."
            printf '%s\n' "$BADGING" | head -1
            exit 1
          fi
          grep -F "versionName='$RELEASE_VERSION'" <<< "$BADGING"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="wifi-automatic-latest"

          cat > release-notes.md <<EOF
          Signed Android build from \`${GITHUB_SHA}\`.

          Rolling release. The APK is replaced after each successful build of \`master\`.
          App version: \`${RELEASE_VERSION}\`.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release edit "$tag" \
              --title "WiFi Automatic · rolling" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "WiFi Automatic · rolling" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" dist/wifi-automatic.apk --clobber
          gh release edit "$tag" --draft=false --latest

          # Keep v2.0.1 for F-Droid/source history.
          gh release delete v2.0.1 --yes 2>/dev/null || true
