name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve release names
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Release tag must start with v and contain only filename-safe characters."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify declared version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          declared="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' build.gradle | head -1)"
          if [ -z "$declared" ] || [ "$declared" != "$RELEASE_VERSION" ]; then
            echo "::error::Tag version $RELEASE_VERSION does not match app versionName ${declared:-missing}."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          check_store="$RUNNER_TEMP/release-check.p12"
          check_password="$(openssl rand -hex 24)"

          if ! keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/release.jks" \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$check_store" \
            -deststoretype PKCS12 \
            -deststorepass "$check_password" \
            -destkeypass "$check_password" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::Release keystore, alias, or password secrets do not match. Re-upload all four signing secrets from the same local .jks file."
            exit 1
          fi
          rm -f "$check_store"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache assembleFdroidRelease

      - name: Sign and name APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find "$GITHUB_WORKSPACE" -path '*/release/*' -name '*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No release APK found."
            find "$GITHUB_WORKSPACE" -name '*.apk' -print
            exit 1
          fi
          OUT="$GITHUB_WORKSPACE/wifi-automatic-$RELEASE_VERSION.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$OUT"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            "$OUT"
          "$BT/apksigner" verify --verbose "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -F "versionName='$RELEASE_VERSION'"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: step-security/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: WiFi Automatic ${{ steps.release.outputs.version }}
          files: ${{ env.APK }}
          generate_release_notes: true
